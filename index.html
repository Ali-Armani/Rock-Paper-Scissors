<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <title>Rock Paper Scissors</title>

</head>

<body>

  <div class="container">
    <h1>Rock Paper Scissors Game</h1>
  </div>
  
  <div>
    <div class="container">
      <button onclick="playGame('Rock')" class="btn">
        🪨
      </button>

      <button onclick="playGame('Paper')" class="btn">
        📃
      </button>

      <button onclick="playGame('Scissors')" class="btn">
        ✂️
      </button>

      <div class="container">

        <p class="js-score"></p>

      </div>

    </div>

    <div class="container">

      <button onclick="resetScore()" class="reset-btn">
        🔃
      </button>

    </div>

  </div>

</body>

</html>
