<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>

</head>

<body>

  <div class="container">
    <h1>Rock Paper Scissors Game</h1>
  </div>
  
  <div>
    <div class="container">
      <button onclick="playGame('Rock')" class="btn">
        Rock
      </button>

      <button onclick="playGame('Paper')" class="btn">
        Paper
      </button>

      <button onclick="playGame('Scissors')" class="btn">
        Scissors
      </button>

    </div>

    <div class="container">

      <button onclick="resetScore()" class="reset-btn">
        Reset
      </button>

    </div>

  </div>

</body>

</html>
